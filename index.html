<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editable React countdown demo</title>
    <style>
        body { font-family: system-ui, sans-serif; color: #172b45; background: #eef6ff; padding: 24px; }
        main { max-width: 650px; margin: auto; padding: 32px; border-radius: 16px; background: white; }
        input-duration { font-size: 1.2rem; }
        button { padding: 9px 16px; border: 0; border-radius: 6px; background: #2563a6; color: white; cursor: pointer; font: inherit; }
        p { line-height: 1.5; }
    </style>
</head>
<body>
    <main>
        <h1>Editable React countdown</h1>
        <p>Set a duration, then press Start. Press Stop to edit the remaining time.</p>
        <div id="app"></div>
    </main>
    <script type="module" src="/demo.js"></script>
</body>
</html>
